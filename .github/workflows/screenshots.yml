# Renders the golden (screenshot) tests on every pull request, commits the
# PNGs back to the PR branch, posts (or updates) one PR comment showing them
# inline, and also uploads them as an artifact named "screenshots".
# UI spec section 11; U14 (commit) and U15 (comment).
# They are screenshots for review, not a pass/fail comparison.
#
# The commit is pushed with GITHUB_TOKEN, and pushes made with that token do
# not start another workflow run, so there is no loop. Its message also
# carries [skip ci], so GitHub does not list a run waiting for approval
# against the bot's commit.
name: screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # U15: post and update the screenshots comment on the PR.
  pull-requests: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the PR's branch itself (not the merge commit), so the
      # screenshots can be committed back onto it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      # Pinned to the Flutter version in the repo's .metadata
      # (revision 2c9eb20739dfec95e2c74bd3dfa4601b0a8a36aa = 3.41.5 stable).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Remove the PNGs from the last run first, so a screenshot whose test
      # was renamed or removed does not linger on the branch.
      - name: Clear old screenshots
        run: rm -f test/goldens/*.png

      - name: Render screenshots
        run: flutter test --tags golden --update-goldens

      - name: Commit screenshots to the PR branch
        id: commit
        # Only for pull requests from this repo (a fork's branch cannot be
        # pushed to), and only when every screenshot rendered.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f -- ':(glob)test/goldens/*.png'
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short_sha="${HEAD_SHA:0:7}"
          git commit -m "Screenshots for ${short_sha} [skip ci]"
          if git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "result=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "result=push-failed" >> "$GITHUB_OUTPUT"
            echo "::error::Could not push the screenshots to the PR branch. If this is a 403, check Settings → Actions → General → Workflow permissions is set to 'Read and write permissions'."
            exit 1
          fi

      # U15: one comment on the PR with every screenshot shown inline,
      # grouped by screen, new and changed ones first. The images point at
      # the PNGs on the branch at the commit that holds them, so an older
      # comment's images do not change under it. Updated in place on each
      # push (found by the hidden marker), never a new comment per run.
      - name: Post screenshots comment
        id: comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (steps.commit.outputs.result == 'pushed' || steps.commit.outputs.result == 'unchanged')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          git diff --name-status FETCH_HEAD "$sha" -- ':(glob)test/goldens/*.png' > "$RUNNER_TEMP/changes.txt"
          python3 .github/workflows/screenshots_comment.py \
            "$REPO" "$sha" "$HEAD_SHA" "$RUNNER_TEMP/changes.txt" "$RUNNER_TEMP/comment.md"
          id="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- screenshots-comment -->"))) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F "body=@$RUNNER_TEMP/comment.md" --jq '.html_url' > "$RUNNER_TEMP/url.txt" || failed=1
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F "body=@$RUNNER_TEMP/comment.md" --jq '.html_url' > "$RUNNER_TEMP/url.txt" || failed=1
          fi
          if [ -n "${failed:-}" ]; then
            echo "::error::Could not post the screenshots comment. If this is a 403, check Settings → Actions → General → Workflow permissions is set to 'Read and write permissions'."
            exit 1
          fi
          echo "url=$(cat "$RUNNER_TEMP/url.txt")" >> "$GITHUB_OUTPUT"

      - name: List screenshots
        if: always()
        run: |
          echo "### Screenshots" >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.commit.outputs.result }}" in
            pushed)    echo "Committed to the PR branch and shown in a comment on the PR. Also in the \`screenshots\` artifact below." >> "$GITHUB_STEP_SUMMARY" ;;
            unchanged) echo "No screenshots changed since the last commit on the PR branch. Also in the \`screenshots\` artifact below." >> "$GITHUB_STEP_SUMMARY" ;;
            *)         echo "Download the \`screenshots\` artifact below." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ -n "${{ steps.comment.outputs.url }}" ]; then
            echo "Screenshots comment: ${{ steps.comment.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          find test/goldens -name '*.png' -not -path '*/failures/*' | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            test/goldens/*.png
          if-no-files-found: warn
          retention-days: 30
